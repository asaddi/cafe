[package]
name = "cafe"
version = "0.1.0"
authors = ["Allan Saddi <allan@saddi.com>"]
edition = "2024"
readme = "README.md"
license = "AGPL-3.0-or-later"

[dependencies]
async-trait = "0.1.92"
bon = "3.10.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rmcp = { version = "3.3.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = "0.9.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
insta = { version = "1.48.0", features = ["redactions", "ron"] }
